// app/api/chat/route.ts
import { streamText } from 'ai';
import { openai } from '@ai-sdk/openai';
import { anthropic } from '@ai-sdk/anthropic';

  anthropic: (model) => anthropic(model),
};

    messages,
  });

}

const FALLBACK_CHAIN = ['anthropic', 'openai', 'groq'];

<script type="text/babel">
/* ═══════════════════════════════════════════
   REEM CHAT — Messages, input, markdown
   ═══════════════════════════════════════════ */

/* ── Markdown-lite renderer ── */
function MarkdownContent({ text }) {
  const blocks = React.useMemo(() => {
    const lines = text.split('\n');
    const result = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (line.startsWith('```')) {
        const lang = line.slice(3).trim();
        const codeLines = [];
        i++;
        while (i < lines.length && !lines[i].startsWith('```')) {
          codeLines.push(lines[i]); i++;
        }
        i++;
        result.push({ type: 'code', lang, content: codeLines.join('\n') });
      } else if (line.startsWith('## ')) {
        result.push({ type: 'h2', content: line.slice(3) }); i++;
      } else if (line.startsWith('# ')) {
        result.push({ type: 'h1', content: line.slice(2) }); i++;
      } else if (line.startsWith('**') && line.endsWith('**')) {
        result.push({ type: 'bold', content: line.slice(2, -2) }); i++;
      } else if (line.startsWith('- ')) {
        const items = [];
        while (i < lines.length && lines[i].startsWith('- ')) {
          items.push(lines[i].slice(2)); i++;
        }
        result.push({ type: 'list', items });
      } else if (line.trim() === '') {
        i++;
      } else {
        result.push({ type: 'p', content: line }); i++;
      }
    }
    return result;
  }, [text]);

  const renderInline = (text) => {
    const parts = text.split(/(`[^`]+`|\*\*[^*]+\*\*)/g);
    return parts.map((part, i) => {
      if (part.startsWith('`') && part.endsWith('`'))
        return <code key={i} style={chatS.inlineCode}>{part.slice(1, -1)}</code>;
      if (part.startsWith('**') && part.endsWith('**'))
        return <strong key={i} style={{ color: 'var(--text-0)', fontWeight: 600 }}>{part.slice(2, -2)}</strong>;
      return <span key={i}>{part}</span>;
    });
  };

  return (
    <div style={chatS.prose}>
      {blocks.map((block, i) => {
        switch (block.type) {
          case 'h1': return <h2 key={i} style={chatS.heading}>{block.content}</h2>;
          case 'h2': return <h3 key={i} style={chatS.subheading}>{block.content}</h3>;
          case 'bold': return <p key={i} style={{ ...chatS.paragraph, fontWeight: 600, color: 'var(--text-0)' }}>{block.content}</p>;
          case 'p': return <p key={i} style={chatS.paragraph}>{renderInline(block.content)}</p>;
          case 'list': return (
            <ul key={i} style={chatS.list}>
              {block.items.map((item, j) => <li key={j} style={chatS.listItem}>{renderInline(item)}</li>)}
            </ul>
          );
          case 'code': return <CodeBlock key={i} lang={block.lang} code={block.content} />;
          default: return null;
        }
      })}
    </div>
  );
}

function CodeBlock({ lang, code }) {
  const [copied, setCopied] = React.useState(false);
  const copy = () => {
    navigator.clipboard?.writeText(code);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  return (
    <div style={chatS.codeBlock}>
      <div style={chatS.codeHeader}>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-2)' }}>{lang || 'code'}</span>
        <button onClick={copy} style={chatS.copyBtn}>
          {copied ? '✓ Copied' : 'Copy'}
        </button>
      </div>
      <pre style={chatS.codePre}><code>{code}</code></pre>
    </div>
  );
}

/* ── Streaming dots ── */
function StreamingIndicator() {
  return (
    <span style={{ display: 'inline-flex', gap: 3, padding: '4px 0' }}>
      {[0, 1, 2].map(i => (
        <span key={i} style={{
          width: 5, height: 5, borderRadius: '50%',
          background: 'var(--accent)', opacity: 0.6,
          animation: `typing 1.2s ease-in-out ${i * 0.15}s infinite`,
        }} />
      ))}
    </span>
  );
}

/* ── Message bubble ── */
function MessageBubble({ msg, isLast }) {
  const [hovered, setHovered] = React.useState(false);
  const isUser = msg.role === 'user';
  const providerData = PROVIDERS.find(p => p.id === msg.provider);

  return (
    <div
      className="fade-in"
      style={{
        ...chatS.msgRow,
        justifyContent: isUser ? 'flex-end' : 'flex-start',
      }}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
    >
      {!isUser && (
        <div style={{
          ...chatS.avatar,
          background: providerData ? providerData.color : 'var(--accent)',
        }}>
          {providerData ? providerData.name[0] : 'R'}
        </div>
      )}
      <div style={{
        ...chatS.msgBubble,
        background: isUser ? 'var(--msg-user-bg)' : 'var(--msg-ai-bg)',
        borderLeft: !isUser ? 'var(--msg-accent-border)' : 'none',
        maxWidth: isUser ? 520 : 'var(--msg-max, 720px)',
      }}>
        {!isUser && (
          <div style={chatS.msgModelTag}>
            <span style={{
              width: 6, height: 6, borderRadius: '50%',
              background: providerData?.color || 'var(--accent)',
            }}></span>
            <span>{msg.model || 'REEM'}</span>
            {msg.tokens && <span style={{ color: 'var(--text-3)' }}>· {msg.tokens} tokens</span>}
            {msg.time && <span style={{ color: 'var(--text-3)' }}>· {msg.time}</span>}
          </div>
        )}
        {isUser ? (
          <p style={{ fontSize: 14, lineHeight: 1.65, color: 'var(--text-0)' }}>{msg.content}</p>
        ) : (
          <MarkdownContent text={msg.content} />
        )}
        {isLast && msg.streaming && <StreamingIndicator />}

        {/* Actions */}
        {hovered && (
          <div style={chatS.msgActions}>
            <button style={chatS.msgActionBtn} title="Copy">⎘</button>
            {!isUser && <button style={chatS.msgActionBtn} title="Regenerate">↻</button>}
            {!isUser && <button style={chatS.msgActionBtn} title="Share">⇧</button>}
          </div>
        )}
      </div>
      {isUser && (
        <div style={{ ...chatS.avatar, background: 'var(--accent-2)' }}>U</div>
      )}
    </div>
  );
}

/* ── Empty state ── */
function EmptyState() {
  const hints = [
    { icon: '⬡', label: 'Refactor my auth module' },
    { icon: '◈', label: 'Generate a landing page' },
    { icon: '◎', label: 'Debug my Vercel deploy' },
    { icon: '⎔', label: 'Design a database schema' },
  ];
  return (
    <div style={chatS.emptyRoot}>
      <div style={chatS.emptyLogo}>R</div>
      <h1 style={chatS.emptyTitle}>What can I help you build?</h1>
      <p style={chatS.emptySubtitle}>11 AI providers · Streaming · Code · Images · Voice</p>
      <div style={chatS.hintGrid}>
        {hints.map((h, i) => (
          <button
            key={i} style={chatS.hintCard}
            onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--border-3)'; e.currentTarget.style.background = 'var(--bg-3)'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.background = 'var(--bg-2)'; }}
          >
            <span style={{ fontSize: 20, color: 'var(--accent)' }}>{h.icon}</span>
            <span style={{ fontSize: 13, color: 'var(--text-1)' }}>{h.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ── Input area ── */
function ChatInput({ onSend, isStreaming, onStop }) {
  const [text, setText] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const [dragOver, setDragOver] = React.useState(false);
  const textareaRef = React.useRef(null);

  const handleSubmit = () => {
    if (!text.trim() || isStreaming) return;
    onSend(text.trim());
    setText('');
    if (textareaRef.current) textareaRef.current.style.height = '24px';
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); }
  };

  const autoGrow = (e) => {
    const el = e.target;
    el.style.height = '24px';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  };

  return (
    <div style={chatS.inputWrapper}>
      <div
        style={{
          ...chatS.inputBox,
          borderColor: focused ? 'var(--border-3)' : 'var(--border)',
          boxShadow: focused ? 'var(--shadow-accent)' : 'none',
          outline: dragOver ? '2px dashed var(--accent)' : 'none',
        }}
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); setDragOver(false); }}
      >
        <div style={chatS.inputRow}>
          <button style={chatS.attachBtn} title="Upload file">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" strokeWidth="2" strokeLinecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea
            ref={textareaRef}
            style={chatS.textarea}
            placeholder="Message REEM..."
            value={text}
            onChange={e => { setText(e.target.value); autoGrow(e); }}
            onKeyDown={handleKeyDown}
            onFocus={() => setFocused(true)}
            onBlur={() => setFocused(false)}
            rows={1}
          />
          <button style={chatS.voiceBtn} title="Voice input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" strokeWidth="2" strokeLinecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
          </button>
          {isStreaming ? (
            <button
              onClick={onStop}
              style={{ ...chatS.sendBtn, background: 'var(--error)' }}
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          ) : (
            <button
              onClick={handleSubmit}
              style={{
                ...chatS.sendBtn,
                opacity: text.trim() ? 1 : 0.4,
              }}
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="none"/></svg>
            </button>
          )}
        </div>
      </div>
      <div style={chatS.inputFooter}>
        <span>Drop files to upload · ⌘K for commands</span>
      </div>
    </div>
  );
}

/* ── Chat view (messages + input) ── */
function ChatView({ messages, onSend, isStreaming, onStop, showEmpty }) {
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [messages]);

  return (
    <div style={chatS.chatRoot}>
      <div ref={scrollRef} style={chatS.messagesScroll}>
        {showEmpty ? (
          <EmptyState />
        ) : (
          <div style={chatS.messagesInner}>
            {messages.map((msg, i) => (
              <MessageBubble key={i} msg={msg} isLast={i === messages.length - 1} />
            ))}
          </div>
        )}
      </div>
      <ChatInput onSend={onSend} isStreaming={isStreaming} onStop={onStop} />
    </div>
  );
}

    display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)',
    gap: 10, maxWidth: 400, width: '100%',
  },
  hintCard: {
    display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 8,
    padding: '16px', borderRadius: 'var(--radius-lg)',
    background: 'var(--bg-2)', border: '1px solid var(--border)',
    cursor: 'pointer', transition: 'all .15s', textAlign: 'left',
  },
  inputWrapper: { padding: '0 24px 16px', maxWidth: 780, margin: '0 auto', width: '100%' },
  inputBox: {
    borderRadius: 'var(--radius-lg)', border: '1px solid var(--border)',
    background: 'var(--input-bg)', transition: 'all .2s',
    padding: '10px 14px',
  },
  inputRow: { display: 'flex', alignItems: 'flex-end', gap: 8 },
  textarea: {
    flex: 1, background: 'transparent', border: 'none',
    resize: 'none', fontSize: 14, lineHeight: 1.5,
    color: 'var(--text-0)', fontFamily: 'var(--font-body)',
    minHeight: 24, maxHeight: 160, outline: 'none',
  },
  attachBtn: {
    width: 34, height: 34, borderRadius: 'var(--radius)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    cursor: 'pointer', flexShrink: 0, background: 'transparent', border: 'none',
  },
  voiceBtn: {
    width: 34, height: 34, borderRadius: 'var(--radius)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    cursor: 'pointer', flexShrink: 0, background: 'transparent', border: 'none',
  },
  sendBtn: {
    width: 34, height: 34, borderRadius: 'var(--radius)',
    background: 'var(--accent)', display: 'flex',
    alignItems: 'center', justifyContent: 'center',
    cursor: 'pointer', flexShrink: 0, transition: 'all .15s', border: 'none',
  },
  inputFooter: {
    textAlign: 'center', fontSize: 11, color: 'var(--text-3)',
    marginTop: 8, fontFamily: 'var(--font-mono)',
  },
};

Object.assign(window, { ChatView, EmptyState, ChatInput, MessageBubble });

</script>
<script type="text/babel">
/* ═══════════════════════════════════════════
   REEM APP — Shell, theme switcher, topbar,
   model picker, command palette, overlays
   ═══════════════════════════════════════════ */

/* ── Theme Switcher Bar ── */
function ThemeSwitcher({ current, onChange }) {
  return (
    <div style={appS.themeSwitcher}>
      <span style={appS.themeSwitcherLabel}>Design Direction</span>
      <div style={appS.themeOptions}>
        {THEMES.map(t => (
          <button
            key={t.id}
            onClick={() => onChange(t.id)}
            style={{
              ...appS.themeCard,
              borderColor: current === t.id ? t.preview[1] : 'var(--border)',
              boxShadow: current === t.id ? `0 0 0 1px ${t.preview[1]}40` : 'none',
            }}
            onMouseEnter={e => { if (current !== t.id) e.currentTarget.style.borderColor = 'var(--border-3)'; }}
            onMouseLeave={e => { if (current !== t.id) e.currentTarget.style.borderColor = 'var(--border)'; }}
          >
            <div style={{ display: 'flex', gap: 3, marginBottom: 6 }}>
              {t.preview.map((c, i) => (
                <div key={i} style={{ width: 14, height: 14, borderRadius: 4, background: c, border: '1px solid rgba(255,255,255,0.1)' }} />
              ))}
            </div>
            <div style={{ fontSize: 12, fontWeight: 600, color: current === t.id ? 'var(--text-0)' : 'var(--text-1)' }}>{t.name}</div>
            <div style={{ fontSize: 10, color: 'var(--text-3)' }}>{t.desc}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ── Model Picker Dropdown ── */
function ModelPicker({ selectedModel, selectedProvider, onSelect, isOpen, onToggle }) {
  const [search, setSearch] = React.useState('');
  const providerData = PROVIDERS.find(p => p.id === selectedProvider);

  const filtered = PROVIDERS.filter(p =>
    p.name.toLowerCase().includes(search.toLowerCase()) ||
    p.models.some(m => m.toLowerCase().includes(search.toLowerCase()))
  );

  return (
    <div style={{ position: 'relative' }}>
      <button onClick={onToggle} style={appS.modelBtn}>
        <span style={{
          width: 8, height: 8, borderRadius: '50%',
          background: providerData?.color || 'var(--accent)',
        }}></span>
        <span style={{ fontWeight: 500, fontSize: 13 }}>{selectedModel}</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" strokeWidth="3" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      {isOpen && (
        <React.Fragment>
          <div style={{ position: 'fixed', inset: 0, zIndex: 98 }} onClick={onToggle} />
          <div className="glass-panel fade-in" style={appS.modelDropdown}>
            <input
              style={appS.modelSearch}
              placeholder="Search models..."
              value={search}
              onChange={e => setSearch(e.target.value)}
              autoFocus
            />
            <div style={{ maxHeight: 320, overflowY: 'auto' }}>
              {filtered.map(provider => (
                <div key={provider.id}>
                  <div style={appS.providerHeader}>
                    <span style={{
                      width: 8, height: 8, borderRadius: '50%',
                      background: provider.color,
                    }}></span>
                    <span>{provider.name}</span>
                  </div>
                  {provider.models
                    .filter(m => m.toLowerCase().includes(search.toLowerCase()) || !search)
                    .map(model => (
                    <button
                      key={model}
                      style={{
                        ...appS.modelOption,
                        background: selectedModel === model ? 'var(--accent-dim)' : 'transparent',
                      }}
                      onClick={() => { onSelect(provider.id, model); onToggle(); setSearch(''); }}
                      onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-3)'}
                      onMouseLeave={e => e.currentTarget.style.background = selectedModel === model ? 'var(--accent-dim)' : 'transparent'}
                    >
                      {model}
                      {selectedModel === model && <span style={{ marginLeft: 'auto', color: 'var(--accent)', fontSize: 14 }}>✓</span>}
                    </button>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ── Command Palette ── */
function CommandPalette({ isOpen, onClose, onAction }) {
  const [search, setSearch] = React.useState('');

  React.useEffect(() => {
    if (isOpen) setSearch('');
  }, [isOpen]);

  const filtered = COMMAND_ITEMS.filter(c =>
    c.label.toLowerCase().includes(search.toLowerCase())
  );

  if (!isOpen) return null;
  return (
    <React.Fragment>
      <div style={appS.paletteOverlay} onClick={onClose} />
      <div className="glass-panel fade-in" style={appS.paletteBox}>
        <input
          style={appS.paletteInput}
          placeholder="Type a command..."
          value={search}
          onChange={e => setSearch(e.target.value)}
          autoFocus
          onKeyDown={e => { if (e.key === 'Escape') onClose(); }}
        />
        <div style={{ maxHeight: 320, overflowY: 'auto' }}>
          {filtered.map((cmd, i) => (
            <button
              key={i}
              style={appS.paletteItem}
              onClick={() => { onAction(cmd.action); onClose(); }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-3)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
            >
              <span style={{ fontSize: 16, width: 28, textAlign: 'center', color: 'var(--accent)' }}>{cmd.icon}</span>
              <span style={{ flex: 1, fontSize: 13, fontWeight: 500 }}>{cmd.label}</span>
              <span style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>{cmd.shortcut}</span>
            </button>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

/* ── System Prompt Modal ── */
function SystemPromptModal({ isOpen, onClose, value, onChange }) {
  if (!isOpen) return null;
  return (
    <React.Fragment>
      <div style={appS.paletteOverlay} onClick={onClose} />
      <div className="glass-panel fade-in" style={{ ...appS.paletteBox, width: 520 }}>
        <div style={{ padding: '16px 20px 12px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontFamily: 'var(--font-heading)', fontWeight: 'var(--fw-heading)', fontSize: 15 }}>System Prompt</span>
          <button onClick={onClose} style={{ fontSize: 18, color: 'var(--text-3)' }}>✕</button>
        </div>
        <div style={{ padding: '12px 20px' }}>
          <div style={{ display: 'flex', gap: 6, marginBottom: 12, flexWrap: 'wrap' }}>
            {SYSTEM_PROMPTS.map((sp, i) => (
              <button
                key={i}
                onClick={() => onChange(sp.prompt)}
                style={{
                  padding: '5px 12px', borderRadius: 'var(--radius)', fontSize: 12,
                  border: '1px solid var(--border)', background: value === sp.prompt ? 'var(--accent-dim)' : 'var(--bg-2)',
                  color: value === sp.prompt ? 'var(--accent)' : 'var(--text-2)',
                  fontWeight: 500, cursor: 'pointer',
                }}
              >{sp.name}</button>
            ))}
          </div>
          <textarea
            style={{
              width: '100%', minHeight: 120, padding: 12, borderRadius: 'var(--radius)',
              background: 'var(--bg-2)', border: '1px solid var(--border)', color: 'var(--text-0)',
              fontSize: 13, lineHeight: 1.6, fontFamily: 'var(--font-body)', resize: 'vertical',
            }}
            value={value}
            onChange={e => onChange(e.target.value)}
          />
        </div>
        <div style={{ padding: '8px 20px 16px', display: 'flex', justifyContent: 'flex-end' }}>
          <button onClick={onClose} style={{
            padding: '8px 20px', borderRadius: 'var(--radius)',
            background: 'var(--accent)', color: '#fff', fontSize: 13,
            fontWeight: 600, cursor: 'pointer',
          }}>Apply</button>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ── Top Bar ── */
function TopBar({ model, provider, onModelSelect, onMenuClick, isMobile, mode, onToggleMode }) {
  const [modelOpen, setModelOpen] = React.useState(false);

  return (
    <div className="glass-panel" style={appS.topBar}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        {isMobile && (
          <button onClick={onMenuClick} style={appS.menuBtn}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-1)" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        )}
        <ModelPicker
          selectedModel={model}
          selectedProvider={provider}
          onSelect={onModelSelect}
          isOpen={modelOpen}
          onToggle={() => setModelOpen(!modelOpen)}
        />
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <button
          onClick={onToggleMode}
          style={appS.iconBtn}
          title={mode === 'dark' ? 'Switch to light' : 'Switch to dark'}
        >
          {mode === 'dark' ? '☀' : '☾'}
        </button>
        <button style={appS.iconBtn} title="Provider stats">⬡</button>
        <div style={appS.statusPill}>
          <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--success)' }}></span>
          <span>Connected</span>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════ */
function App() {
  const [theme, setTheme] = React.useState('sovereign');
  const [mode, setMode] = React.useState('dark');
  const [activeChat, setActiveChat] = React.useState('c1');
  const [messages, setMessages] = React.useState(SAMPLE_MESSAGES);
  const [showEmpty, setShowEmpty] = React.useState(false);
  const [sidebarOpen, setSidebarOpen] = React.useState(false);
  const [cmdOpen, setCmdOpen] = React.useState(false);
  const [sysPromptOpen, setSysPromptOpen] = React.useState(false);
  const [systemPrompt, setSystemPrompt] = React.useState(SYSTEM_PROMPTS[0].prompt);
  const [model, setModel] = React.useState('claude-sonnet-4');
  const [provider, setProvider] = React.useState('claude');
  const [isStreaming, setIsStreaming] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 768);

  React.useEffect(() => {
    const fn = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-mode', mode);
  }, [mode]);

  React.useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault(); setCmdOpen(prev => !prev);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const handleSend = (text) => {
    const userMsg = { role: 'user', content: text };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setShowEmpty(false);
    setIsStreaming(true);

    setTimeout(() => {
      const aiMsg = {
        role: 'assistant',
        content: `I'll help you with that. Here's my analysis:\n\n**Key Points:**\n- The approach you're describing is solid\n- Consider adding error boundaries for resilience\n- I'd recommend implementing \`retry logic\` with exponential backoff\n\nWould you like me to elaborate on any of these points?`,
        model, provider,
        tokens: Math.floor(Math.random() * 200) + 100,
        time: (Math.random() * 2 + 0.5).toFixed(1) + 's',
      };
      setMessages(prev => [...prev, aiMsg]);
      setIsStreaming(false);
    }, 1800);
  };

  const handleNewChat = () => {
    setMessages([]);
    setShowEmpty(true);
    setActiveChat(null);
  };

  const handleSelectChat = (id) => {
    setActiveChat(id);
    setMessages(SAMPLE_MESSAGES);
    setShowEmpty(false);
  };

  const handleCommandAction = (action) => {
    switch (action) {
      case 'new-chat': handleNewChat(); break;
      case 'system-prompt': setSysPromptOpen(true); break;
      case 'theme': setMode(m => m === 'dark' ? 'light' : 'dark'); break;
      default: break;
    }
  };

  return (
    <div style={appS.root}>
      {/* Theme Switcher */}
      <ThemeSwitcher current={theme} onChange={setTheme} />

      {/* App Layout */}
      <div style={appS.appLayout}>
        <Sidebar
          activeChat={activeChat}
          onSelectChat={handleSelectChat}
          onNewChat={handleNewChat}
          onDeleteChat={(id) => { if (id === activeChat) handleNewChat(); }}
          sidebarOpen={sidebarOpen}
          onCloseSidebar={() => setSidebarOpen(false)}
          isMobile={isMobile}
        />
        <div style={appS.mainArea}>
          <TopBar
            model={model}
            provider={provider}
            onModelSelect={(p, m) => { setProvider(p); setModel(m); }}
            onMenuClick={() => setSidebarOpen(true)}
            isMobile={isMobile}
            mode={mode}
            onToggleMode={() => setMode(m => m === 'dark' ? 'light' : 'dark')}
          />
          <ChatView
            messages={messages}
            onSend={handleSend}
            isStreaming={isStreaming}
            onStop={() => setIsStreaming(false)}
            showEmpty={showEmpty}
          />
        </div>
      </div>

      {/* Overlays */}
      <CommandPalette isOpen={cmdOpen} onClose={() => setCmdOpen(false)} onAction={handleCommandAction} />
      <SystemPromptModal isOpen={sysPromptOpen} onClose={() => setSysPromptOpen(false)} value={systemPrompt} onChange={setSystemPrompt} />
    </div>
  );
}

/* ── App Styles ── */
const appS = {
  root: { height: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--bg-0)' },
  themeSwitcher: {

  },

  },
  appLayout: { flex: 1, display: 'flex', overflow: 'hidden' },
  mainArea: { flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--bg-0)' },

  },

    transition: 'all .12s', background: 'transparent', border: 'none',
  },
  statusPill: {
    display: 'flex', alignItems: 'center', gap: 6,
    padding: '5px 12px', borderRadius: 999,
    border: '1px solid var(--border)', fontSize: 11,
    color: 'var(--text-2)', fontFamily: 'var(--font-mono)',
  },
  paletteOverlay: {
    position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)',
    backdropFilter: 'blur(4px)', zIndex: 199,
  },
  paletteBox: {
    position: 'fixed', top: '18%', left: '50%', transform: 'translateX(-50%)',
    width: 480, maxWidth: 'calc(100vw - 32px)', background: 'var(--bg-1)',
    border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)',
    boxShadow: 'var(--shadow)', zIndex: 200, overflow: 'hidden',
  },
  paletteInput: {
    width: '100%', padding: '14px 20px', border: 'none',
    borderBottom: '1px solid var(--border)', background: 'transparent',
    fontSize: 15, color: 'var(--text-0)', outline: 'none',
    fontFamily: 'var(--font-body)',
  },
  paletteItem: {
    width: '100%', display: 'flex', alignItems: 'center', gap: 10,
    padding: '10px 16px', cursor: 'pointer',
    transition: 'background .1s', color: 'var(--text-1)',
    background: 'transparent', border: 'none', textAlign: 'left',
  },
};

/* ── Mount ── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
